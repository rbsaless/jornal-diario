name: Jornal diário

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC = 05:30 em Brasília
  workflow_dispatch:        # botão "Run workflow" para testar na hora

permissions:
  contents: write

concurrency: jornal

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar a edição do dia
        run: python gerar_jornal.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Publicar
        run: |
          git config user.name "jornal-bot"
          git config user.email "jornal-bot@users.noreply.github.com"
          git add docs
          git commit -m "Edição de $(TZ=America/Sao_Paulo date +%F)" || exit 0
          git push
      - name: Avisar no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Seu jornal de hoje está pronto: https://rbsaless.github.io/jornal-diario/"
